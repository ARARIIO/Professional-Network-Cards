services:
  db:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure
    hostname: db
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--insecure", "--host=localhost", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  db-init:
    image: cockroachdb/cockroach:latest
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /cockroach/cockroach
      - sql
      - --insecure
      - --host=db
      - -e
      - CREATE DATABASE IF NOT EXISTS pnc_db;

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set local http://minio:9000 minio miniosecret;
      mc mb -p local/pnc-cards;
      mc anonymous set download local/pnc-cards;
      exit 0;
      "

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://root@db:26257/pnc_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: miniosecret
      S3_BUCKET: pnc-cards
      S3_PUBLIC_URL: http://localhost:3000/storage/files
      NODE_ENV: development
      LOG_LEVEL: info
      LOG_FORMAT: pretty
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_started

volumes:
  cockroach_data:
  minio_data:
