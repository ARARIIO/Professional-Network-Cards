services:
  db:
    image: cockroachdb/cockroach:latest
    command: start-single-node --insecure
    hostname: db
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--insecure", "--host=localhost", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  db-init:
    image: cockroachdb/cockroach:latest
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /cockroach/cockroach
      - sql
      - --insecure
      - --host=db
      - -e
      - CREATE DATABASE IF NOT EXISTS pnc_db;

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 4;
      mc alias set local http://minio:9000 minio miniosecret;
      mc mb -p local/pnc-cards;
      mc anonymous set download local/pnc-cards;
      exit 0;
      "

volumes:
  cockroach_data:
  minio_data:
